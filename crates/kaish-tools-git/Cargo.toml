[package]
name = "kaish-tools-git"
description = "A shallow, safety-first git read surface for kaish, built on gitoxide plumbing (not the gix facade) to keep spawn-capable machinery out of the dependency graph"
keywords = ["git", "gitoxide", "kaish", "read-only"]
categories = ["development-tools", "filesystem"]
# Not the workspace version. crates.io already holds a libgit2-era
# `kaish-tools-git` at 0.8.4 (a different codebase under the same name), so
# this rewrite publishes forward rather than resetting the number — see
# docs/design/publishing.md. `^0.8` does not resolve to 0.9.0, so no existing
# consumer moves.
version = "0.9.0"
edition.workspace = true
license.workspace = true
authors.workspace = true
repository.workspace = true

# `tests/support.rs` is a shared harness, not a test target: architecture.md
# A.1 names that path, and cargo would otherwise auto-discover it as its own
# (empty) integration test. Turning autodiscovery off and naming the real
# targets keeps the documented layout without a `support/mod.rs` detour.
autotests = false

# Path 2 plumbing pin set (docs/design/architecture.md, Co-architect note 3):
# built directly on gix's low-level crates, skipping the `gix` facade crate
# entirely. The facade links gix-command unconditionally (even with
# `--no-default-features`) via gix-command -> gix-transport -> gix-protocol ->
# gix, which reintroduces subprocess-spawn machinery into a build that must
# not have any (kaish-extras#4). This plumbing set is empirically verified
# spawn-free: `cargo tree -i` for gix-command/gix-transport/gix-filter finds
# nothing on this crate's dependency tree. Exact patch pins per house rule
# (bump policy is issue #14) recorded at the minor versions the design
# verified; do not bump without re-running the tripwires.
#
# Every one of these crates gates its hash implementation behind its own
# `sha1`/`sha256` feature (gix-hash itself has `default = []` — it will not
# even compile without one selected). None of them turn `sha1` on by
# default, and Cargo does not infer it from a sibling crate's choice, so it
# is requested explicitly on every edge below rather than left to unify by
# accident.
#
# These are `target`-scoped, not plain `[dependencies]`, and that is load-
# bearing, not cosmetic: `gix-discover` and `gix-config` both pull `gix-sec`,
# which does not compile on `wasm32-unknown-unknown` (the ownership check
# uses `geteuid`/`MetadataExt::uid`, see src/lib.rs's guard). Cargo compiles
# a crate's dependencies before the crate itself, so if these were plain
# dependencies, `cargo build --target wasm32-unknown-unknown` would fail on
# `gix-sec` deep in the graph *before* ever reaching this crate's own
# `compile_error!` — surfacing a confusing native-code error instead of the
# one honest message naming the real blocker. Scoping the whole pin set to
# `cfg(not(target_family = "wasm"))` means a wasm build has zero dependencies
# to compile, so `cargo build -p kaish-tools-git --target
# wasm32-unknown-unknown` fails fast on the guard, with only our message.
[target.'cfg(not(target_family = "wasm"))'.dependencies]
gix-object = { version = "=0.63.0", features = ["sha1"] }
# `CommitRef::author()`/`committer()` hand back a `gix_actor::SignatureRef`, and
# gix-object does not re-export the crate that owns it. `git log` names the type,
# so it pins the crate rather than reaching for a re-export that is not there.
# Already in the graph under gix-object; pinned because we use it directly.
gix-actor = "=0.41.2"
gix-odb = { version = "=0.83.0", features = ["sha1"] }
gix-ref = { version = "=0.66.0", features = ["sha1"] }
gix-traverse = { version = "=0.60.0", features = ["sha1"] }
gix-revision = { version = "=0.48.0", features = ["sha1"] }
gix-revwalk = { version = "=0.34.0", features = ["sha1"] }
gix-commitgraph = { version = "=0.38.0", features = ["sha1"] }
gix-discover = { version = "=0.54.0", features = ["sha1"] }
gix-index = { version = "=0.54.0", features = ["sha1"] }
gix-pack = { version = "=0.73.0", features = ["sha1"] }
# The status half `gix-status` would have provided, hand-composed: the worktree
# walk's ignore stack and the glob/ignore matchers under it (architecture.md
# A.2 — "we own .gitignore and pathspec matching"). `gix-worktree` is taken
# `default-features = false` on purpose: its default `attributes` feature pulls
# gix-attributes, which status has no use for. Only the ignore Stack is used.
# None of the three links gix-command/gix-transport/gix-filter — the CI
# tripwires assert that stays true.
gix-worktree = { version = "=0.55.0", default-features = false, features = ["sha1"] }
gix-ignore = "=0.22.0"
gix-glob = "=0.27.0"
# `gix-index::State::from_bytes` takes a `filetime::FileTime` timestamp for its
# racy-clean pass-through. We never write the index back and detect worktree
# modification by hashing content, not by the stat cache, so a zero timestamp
# is correct here — but the type has to be nameable. `filetime` is already in
# the graph via gix-index; this pins the same one for direct use. Not a gix
# crate, so it stays out of the reported pin set.
filetime = "0.2"
# default-features = false and WITHOUT the `blob` feature: `blob` pulls in
# gix-command (textconv/filter machinery) via its rewrite/rename tracker.
# Losing that feature means rename detection is exact-match-only — reported
# honestly to callers, not silently degraded (architecture.md Co-architect
# note 3). `git log --stat` uses only the low-level `gix_diff::tree()` name/
# status walk, which is available without `blob`.
gix-diff = { version = "=0.66.0", default-features = false, features = ["sha1"] }
# The line-diff engine `git log --stat` counts additions/deletions with — the
# same crate `gix-diff`'s `blob` feature would have pulled, taken directly so
# `blob` (and its `gix-command` edge) stays out of the graph. Its only runtime
# dependencies are `bstr` and `hashbrown`; it links no spawn machinery, so the
# CI tripwires stay green. `Algorithm::Myers` matches git's default diff, so the
# counts agree with `git log --numstat` on ordinary text (architecture.md B.3).
gix-imara-diff = { version = "=0.2.4", default-features = false }
# `git log` renders each commit's author/committer time as RFC3339 with the
# commit's own offset preserved (`Time::format(ISO8601_STRICT)`). Already in the
# graph via gix-object; pinned here for direct use. Native-only like the rest —
# `git log` does not build for wasm — so a fixed offset is what is wanted, not a
# named-zone table (kaish #225).
gix-date = "=0.15.6"
# `gix-config` (not `gix::config`) parses repo-local `.git/config` without
# gix-command. We resolve `include.path` ourselves via
# `from_bytes_no_includes`, which retires the include.path escape by
# construction rather than trusting gix to refuse it.
gix-config = { version = "=0.59.0", features = ["sha1"] }
# `--since` / `--until` accept RFC3339 or `YYYY-MM-DD` and nothing else, so the
# parser must be *strict*: git's `approxidate` ("2 weeks ago") is a pattern
# language we deliberately do not accept. `jiff` parses both accepted forms and
# rejects the rest, and — used for a fixed-offset instant and a UTC civil date —
# it reads no system timezone database, keeping the parse hermetic. Already in
# the graph via gix-date. Not a gix crate, so it stays out of the reported pin
# set.
jiff = "0.2"

# The kaish tool surface, and the crates a `Tool` impl needs to talk to it.
# `kaish-tool-api` + `kaish-types` are the whole out-of-tree contract — this
# crate deliberately does not depend on `kaish-kernel`, so "the public API is
# sufficient for a non-trivial plugin" (architecture.md G.2) stays a property
# the compiler checks rather than a claim.
#
# Target-scoped like the pin set above, for the same reason: on wasm this
# crate must fail on its own `compile_error!` with nothing else to compile.
kaish-tool-api = { workspace = true }
kaish-types = { workspace = true }

async-trait = "0.1"
# `string` is not cosmetic here: the tool name is embedder-configurable
# (`GitConfig::with_tool_name`), so the clap root command is built from a
# runtime `String`, which `clap::builder::Str` only accepts with that feature.
clap = { version = "4", features = ["derive", "string"] }
serde = { version = "1", features = ["derive"] }
serde_json = { version = "1", features = ["preserve_order"] }
thiserror = "2"
tracing = "0.1"
# `rt` for `Handle::try_current()` / `RuntimeFlavor`, `rt-multi-thread` for
# `block_in_place` itself — both are what `block_in_place_compat` needs to
# choose a path instead of panicking on a current-thread runtime (E.3).
tokio = { version = "1", features = ["rt", "rt-multi-thread"] }

# Dev-dependencies are not target-scoped: `cargo test` only ever runs on a
# native target, where the crate compiles.
[dev-dependencies]
sha2 = "0.10"
tempfile = "3"
tokio = { version = "1", features = ["rt", "rt-multi-thread", "macros"] }

[[test]]
name = "readonly_fingerprint"
path = "tests/readonly_fingerprint.rs"

[[test]]
name = "discovery_ceiling"
path = "tests/discovery_ceiling.rs"

[[test]]
name = "hostile_repo"
path = "tests/hostile_repo.rs"

[[test]]
name = "status"
path = "tests/status.rs"

[[test]]
name = "log"
path = "tests/log.rs"

[[test]]
name = "ls"
path = "tests/ls.rs"

[[test]]
name = "show"
path = "tests/show.rs"

[[test]]
name = "diff"
path = "tests/diff.rs"

[[test]]
name = "write_shaped_identifiers"
path = "tests/write_shaped_identifiers.rs"

[[test]]
name = "operands"
path = "tests/operands.rs"

# Gated on KAISH_GIT_BIG_REPO (unset: prints why it is skipping and passes).
# See tests/big_repo.rs's module doc.
[[test]]
name = "big_repo"
path = "tests/big_repo.rs"
