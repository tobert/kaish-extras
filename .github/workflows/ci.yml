# The gates, cribbed from kaish's ci.yml: clippy on the wasm target (the only
# target kaish-web builds for), the full site build + real-time e2e, and the
# Rust tool crates (build, clippy, test, dependency tripwires, wasm guard).
#
# Runs on pull_request **and** on push to main. Main matters because we work
# on main directly while kaish-extras hardens. This was `pull_request` only,
# on the reasoning that pages.yml re-runs the site build and e2e on push —
# true, but pages.yml runs *nothing else*, so a direct push to main had no
# clippy and no tool-crate gate at all. That is how a `kaish-tools-curl` that
# did not compile reached main. Only `site-e2e` is skipped on push, because
# that one really is pages.yml's job.
#
# Actions are pinned by commit SHA, not tag — a tag can be moved, a digest
# can't (supply-chain). Each pin carries a `# vX.Y.Z` comment naming the
# release it points at, for humans and Dependabot.
name: ci

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  clippy:
    name: clippy (wasm target)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0

      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@fa04a1451ff1842e2626ccb99004d0195b455a88 # stable branch, pinned 2026-07-05
        with:
          toolchain: stable
          targets: wasm32-unknown-unknown

      - name: Cache cargo
        uses: Swatinem/rust-cache@c19371144df3bb44fab255c43d04cbc2ab54d1c4 # v2.9.1
        with:
          key: clippy-wasm

      - name: Clippy (deny warnings)
        run: cargo clippy --target wasm32-unknown-unknown -p kaish-web --all-targets --locked -- -D warnings

  site-e2e:
    name: site build + e2e
    # pages.yml runs exactly this on push to main, in front of the deploy.
    if: github.event_name == 'pull_request'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0

      # The playground seeds kaish's own source tree; check it out beside us.
      - uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0
        with:
          repository: tobert/kaish
          path: kaish-src

      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@fa04a1451ff1842e2626ccb99004d0195b455a88 # stable branch, pinned 2026-07-05
        with:
          toolchain: stable
          targets: wasm32-unknown-unknown

      - name: Cache cargo
        uses: Swatinem/rust-cache@c19371144df3bb44fab255c43d04cbc2ab54d1c4 # v2.9.1
        with:
          key: site-e2e

      - name: Install binaryen (wasm-opt)
        run: sudo apt-get update && sudo apt-get install -y binaryen

      - name: Install wasm-bindgen-cli (locked version)
        run: |
          ver=$(grep -A1 '^name = "wasm-bindgen"$' Cargo.lock | grep '^version' | cut -d'"' -f2)
          echo "wasm-bindgen $ver"
          cargo install wasm-bindgen-cli --version "$ver" --locked

      - name: Build site
        run: scripts/build-site.sh ./kaish-src

      - uses: denoland/setup-deno@22d081ff2d3a40755e97629de92e3bcbfa7cf2ed # v2.0.5
        with:
          deno-version: v2.x

      - name: e2e against the built site (runner's chrome, real-time CDP)
        run: |
          python3 -m http.server -d site 8137 &
          sleep 1
          deno run --allow-net --allow-run scripts/e2e.ts

  git-tool:
    name: kaish-tools-git (native)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0

      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@fa04a1451ff1842e2626ccb99004d0195b455a88 # stable branch, pinned 2026-07-05
        with:
          toolchain: stable

      - name: Cache cargo
        uses: Swatinem/rust-cache@c19371144df3bb44fab255c43d04cbc2ab54d1c4 # v2.9.1
        with:
          key: git-tool-native

      # Both feature configurations, because `textdiff` gates a third of this
      # crate's diff path and a lint clean on one build says nothing about the
      # other. The suite is gated the same way: `tests/textdiff.rs` compiles to
      # nothing without the feature, and three refusal tests in `diff.rs` and
      # `log.rs` compile to nothing with it.
      - name: Clippy (deny warnings)
        run: |
          cargo clippy -p kaish-tools-git --all-targets --locked -- -D warnings
          cargo clippy -p kaish-tools-git --all-targets --locked --features textdiff -- -D warnings

      - name: Build
        run: cargo build -p kaish-tools-git --locked

      # The fixture harness shells out to real git as its oracle, so a fixture
      # is whatever git actually produces — a real pack, a real `worktrees/`
      # entry, real `packed-refs` — rather than whatever we believed it
      # produces. That is fine in tests and forbidden in the crate, which
      # links no spawn machinery at all (the tripwires below).
      # ubuntu-latest ships git; the harness asserts its presence rather than
      # skipping, so a runner without it fails loudly instead of reporting a
      # green suite that proved nothing.
      - name: Test (real git is the fixture oracle)
        run: |
          git --version
          cargo test -p kaish-tools-git --locked
          cargo test -p kaish-tools-git --locked --features textdiff

  curl-tool:
    name: kaish-tools-curl (native)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0

      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@fa04a1451ff1842e2626ccb99004d0195b455a88 # stable branch, pinned 2026-07-05
        with:
          toolchain: stable

      - name: Cache cargo
        uses: Swatinem/rust-cache@c19371144df3bb44fab255c43d04cbc2ab54d1c4 # v2.9.1
        with:
          key: curl-tool-native

      # This job exists because its absence shipped a crate that did not
      # compile: `src/backend/ureq.rs` used `base64` with no `base64`
      # dependency and reached main, because CI built kaish-tools-git and
      # nothing else. Clippy denies warnings for the same reason git's does.
      - name: Clippy (deny warnings)
        run: cargo clippy -p kaish-tools-curl --all-targets --locked -- -D warnings

      - name: Build
        run: cargo build -p kaish-tools-curl --locked

      # The functional tests stand up a real local HTTP server on loopback
      # (tests/support.rs) — no network egress, no fixtures to install.
      - name: Test (against the local HTTP harness)
        run: cargo test -p kaish-tools-curl --locked

  git-tool-dependency-tripwires:
    name: kaish-tools-git dependency tripwire (${{ matrix.pkg }})
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        # docs/design/architecture.md §A.4/D.3: a default kaish-tools-git
        # build must not be able to spawn a subprocess, and must not drag in
        # a C TLS/crypto stack. Scoped `--workspace` (the whole lockfile),
        # deliberately: these seven packages must never appear anywhere in
        # this repo's dependency graph, not only under kaish-tools-git, so a
        # regression introduced by any workspace member — kaish-web included
        # — trips the same wire.
        pkg:
          - gix-command
          - gix-transport
          - gix-filter
          - aws-lc-sys
          - openssl-sys
          - native-tls
          - curl-sys
    steps:
      - uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0

      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@fa04a1451ff1842e2626ccb99004d0195b455a88 # stable branch, pinned 2026-07-05
        with:
          toolchain: stable

      - name: Cache cargo
        uses: Swatinem/rust-cache@c19371144df3bb44fab255c43d04cbc2ab54d1c4 # v2.9.1
        with:
          key: git-tool-tripwires

      # `cargo tree -i <pkg>` exits non-zero with "did not match any
      # packages" when the package is genuinely absent, and exits 0 and
      # prints the reverse-dependency tree when it is present — so success
      # is the failure case here. Distinguish "cleanly absent" from any
      # other cargo error so a broken invocation can't pass by accident.
      # The negative control for the assertion below. `cargo tree -i` reports
      # "did not match any packages" for a package that is absent *and* for a
      # package name nobody can resolve — a typo, a renamed crate, a cargo
      # that changed its wording. A tripwire that cannot distinguish those is
      # a gate that can only pass. So first prove the invocation finds
      # something: gix-imara-diff is in this graph and must resolve.
      - name: Prove cargo tree -i can find a package that is present
        run: |
          cargo tree -i gix-imara-diff --workspace --locked
          cargo tree -i gix-imara-diff --workspace --locked --features kaish-tools-git/textdiff

      # Twice: the default feature set, and `kaish-tools-git/textdiff`. A
      # tripwire that only ever ran on the default set would prove nothing
      # about the feature — and `textdiff` is precisely the axis A.2 once
      # described as the no-subprocess boundary, so it is the one an embedder
      # would most want the assertion for. It adds no dependency today
      # (gix-imara-diff is already unconditional); the second run is what says
      # so, and what catches the day that changes.
      - name: Assert ${{ matrix.pkg }} is absent from the workspace lockfile
        run: |
          for features in "" "--features kaish-tools-git/textdiff"; do
            echo "::group::${{ matrix.pkg }} with features: ${features:-<default>}"
            set +e
            out=$(cargo tree -i ${{ matrix.pkg }} --workspace --locked $features 2>&1)
            code=$?
            set -e
            echo "$out"
            echo "::endgroup::"
            if [ "$code" -eq 0 ]; then
              echo "::error::${{ matrix.pkg }} IS present in the dependency graph (${features:-default features}) — expected absent"
              exit 1
            fi
            if ! echo "$out" | grep -q "did not match any packages"; then
              echo "::error::cargo tree failed for a reason other than a clean 'not found' (${features:-default features})"
              exit 1
            fi
          done

  git-tool-wasm-guard:
    name: kaish-tools-git wasm guard fires
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0

      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@fa04a1451ff1842e2626ccb99004d0195b455a88 # stable branch, pinned 2026-07-05
        with:
          toolchain: stable
          targets: wasm32-unknown-unknown

      - name: Cache cargo
        uses: Swatinem/rust-cache@c19371144df3bb44fab255c43d04cbc2ab54d1c4 # v2.9.1
        with:
          key: git-tool-wasm-guard

      # The pin set is target-scoped to `cfg(not(target_family = "wasm"))`
      # (see crates/kaish-tools-git/Cargo.toml) specifically so this build
      # has zero dependencies to compile on wasm and fails on our own
      # `compile_error!` immediately — not on gix-sec deep in the graph with
      # an unrelated native-code error. Assert both that the build fails and
      # that it fails with our message.
      - name: Assert the build fails with our compile_error, not a transitive one
        run: |
          set +e
          out=$(cargo build -p kaish-tools-git --target wasm32-unknown-unknown --locked 2>&1)
          code=$?
          set -e
          echo "$out"
          if [ "$code" -eq 0 ]; then
            echo "::error::kaish-tools-git built for wasm32-unknown-unknown — the guard did not fire"
            exit 1
          fi
          if ! echo "$out" | grep -q "kaish-tools-git does not build for wasm targets yet: gix-sec fails to compile on wasm32-unknown-unknown"; then
            echo "::error::build failed, but not on our compile_error! guard — see output above"
            exit 1
          fi
