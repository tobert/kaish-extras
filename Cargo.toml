[workspace]
resolver = "2"
members = ["crates/kaish-web", "crates/kaish-tools-git"]

[workspace.package]
version = "0.1.0"
edition = "2021"
license = "MIT"
authors = ["Amy Tobey <tobert@gmail.com>"]
repository = "https://github.com/tobert/kaish-extras"

# kaish is pinned by git sha while kaish-extras finds its feet; switch every
# kaish-* dependency to the published crates.io release before any release of
# the crates in this workspace.
[workspace.dependencies]
# Every kaish crate must pin the SAME rev — mixing revs would put two copies
# of a kaish crate in the graph. Currently kaish main post-v0.13.0, ledger-spec
# era (post-#271; includes jobctl #248, spill #249, CSPRNG nonces #259).
kaish-kernel = { git = "https://github.com/tobert/kaish.git", rev = "e4e2ca9523263f303b2fd4341a3ef61b872a84b1", default-features = false }
kaish-client = { git = "https://github.com/tobert/kaish.git", rev = "e4e2ca9523263f303b2fd4341a3ef61b872a84b1" }
# The out-of-tree tool surface: `kaish-tools-git` implements `Tool` against
# these two and never touches `kaish-kernel`, which is the whole point of the
# honest-external-embedder posture — `kaish-tools-host` (kaish's own
# out-of-tree bundle) depends on exactly this pair and nothing more.
kaish-tool-api = { git = "https://github.com/tobert/kaish.git", rev = "e4e2ca9523263f303b2fd4341a3ef61b872a84b1" }
kaish-types = { git = "https://github.com/tobert/kaish.git", rev = "e4e2ca9523263f303b2fd4341a3ef61b872a84b1" }

[profile.release]
# The wasm bundle ships over the network — favor size.
opt-level = "z"
lto = true
codegen-units = 1
strip = true

